name: Build & Push to GHCR

on:
  pull_request:
    branches: [ deploy ]
  push:
    branches: [ deploy ]
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Configure Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <servers>
              <server>
                <id>github-d94</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.PACKAGES_TOKEN}</password>
              </server>
              <server>
                <id>github-lib-core</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.PACKAGES_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      # 통합 테스트(Testcontainers Redis)는 러너의 Docker 를 사용한다.
      - name: Maven Build & Test
        run: mvn -B clean verify
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          # Repository Settings > Secrets and variables > Actions 에 read:packages 스코프를 가진
          # classic PAT을 PACKAGES_TOKEN 이름으로 등록해야 합니다.
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      # PR 은 빌드/테스트까지만 수행
      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/deploy' }}

      - name: Build and Push
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
