# UMD local 모드 라우팅 (umd.local.routes). config/routes.yml 로 복사해서 사용한다.
#
# - path-prefix 최장 일치. "/v1/cira" 는 /v1/cira, /v1/cira/** 와 일치하고 /v1/cirax 와는 일치하지 않는다.
# - 경로는 바꾸지 않는다: UI(BACKEND_URL)가 부른 경로를 그대로 {uri}{경로} 로 호출한다.
#   context-path 는 UI BACKEND_URL 과 uri 중 **한 곳에만** 둔다.
#   현재 d94-web 은 BACKEND_URL 에 /tsh/api 를 포함하므로 uri 에는 host:port 만 쓴다 (/tsh 를 붙이면 /tsh/tsh/...).
# - 일치하는 route 가 없으면 404 UMD_NO_ROUTE.
# - 이 표는 나중에 백엔드를 서버로 올릴 때 Ingress / Gateway 라우팅 규칙으로 그대로 옮긴다.
#
# uri 주소:
# - 같은 docker 네트워크(SHARED_NETWORK_NAME)의 컨테이너 → 컨테이너 이름 + 컨테이너 내부 포트
# - 호스트에서 직접 띄운 프로세스 / 포트를 publish 한 컨테이너 → host.docker.internal:{호스트 포트}
umd:
  local:
    routes:
      # Spring Cloud Gateway (Eureka 로 d94-query 등에 분배). 게이트웨이에 Path=/tsh/** route 가 있어야 한다.
      - id: gateway
        path-prefix: /
        uri: http://gateway-cloud-gateway-1:10001
      # 게이트웨이를 거치지 않고 서비스를 직접 부르는 예 (prefix 가 더 길어 우선 적용)
      # - id: cira
      #   path-prefix: /tsh/api/v1/cira
      #   uri: http://host.docker.internal:8082
