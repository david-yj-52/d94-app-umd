# delap 실제 설정 — 서버의 ~/data/app/umd/config/routes.yml 로 복사 (git 제외 파일)
# 모든 요청을 게이트웨이 컨테이너(befw-cloud-network)로 보낸다.
umd:
  local:
    routes:
      - id: gateway
        path-prefix: /
        uri: http://gateway-cloud-gateway-1:10001
      # MCP 서버 (app/d94-mcp). prefix 가 더 길어 우선 — /mcp 그대로 http://d94-mcp:8095/mcp
      - id: d94-mcp
        path-prefix: /mcp
        uri: http://d94-mcp:8095
